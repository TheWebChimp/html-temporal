# Dentro del <VirtualHost *:443> de tu dominio.
# Si el vhost hace proxy de "/" a una app, el "ProxyPass ... !" debe ir ANTES
# del ProxyPass general para que esta ruta no se mande a la app.
# Requiere mod_alias y mod_headers.

ProxyPass /tmp-html/ !
Alias /tmp-html/ /var/www/tmp-html/
<Directory /var/www/tmp-html/>
	Options -Indexes
	AllowOverride None
	Require all granted
	Header set X-Robots-Tag "noindex, nofollow"
	Header set Cache-Control "no-store"
	Header set Referrer-Policy "no-referrer"
</Directory>
